subject_count: 1
subjects:
  - identity: 河小智，白色圆润机器人、蓝色发光面屏、头顶蓝色天线球、蓝色腰环
style: 参考用户提供的河小智浮动状态连续动作图，白蓝色、亲切、柔和、轻科技
motion_intent: 低位准备、上升抬手、继续升高、高位轻摆手、下降放手、低位完成的连续闭环；地面光影随高度变化，点击角色微笑回应，保留回答和语音状态表情
background_owner: page
scene: null
driver: time
input_semantics: continuous
time_control: autonomous
navigation: none
clip_continuity: independent
continuity:
  - 角色轮廓、白蓝配色和天线保持不变
  - 浮动和呼吸不改变页面布局
  - 手臂与天线为原图的刚性分层，不改变零件数量和形状
  - 表情仅发生在面屏的眼睛与嘴巴
  - 眼睛遵循用户提供的眼部表情与动画规范图：青蓝发光圆角方框外圈，两眼内侧各有窄条光核；保留中空中心，支持看左、看右、看上、看下和眨眼
  - 开心和回答为弧形笑眼，疑问为方框与问号，思考为半闭眼，倾听为光核呼吸，成功为上扬折线，未识别为同心圆眼
  - 自然眨眼间隔 3–5 秒，开合过程 0.25–0.35 秒，视线转移 0.1–0.2 秒
  - 背景光晕、光带和粒子低幅度呼吸，不遮挡内容
aspect_ratio: 1:1
destination: 校园助手页面顶部；桌面欢迎态最大 192x192 CSS 像素，移动端 140x140，对话态 104x104，手机对话态 72x72
